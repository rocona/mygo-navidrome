name: Plugin Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag in MAJOR.MINOR.PATCH format, such as 0.1.0."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Build plugin ZIP
        env:
          TAG: ${{ github.ref_name }}
        run: zip -r "mygo-navidrome-${TAG}.zip" plugin.json index.js README.md locales/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="mygo-navidrome-${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --title "Navidrome $TAG" --generate-notes
          fi
